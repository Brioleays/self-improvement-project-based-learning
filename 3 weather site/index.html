<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <style type="text/tailwindcss"></style>
    <script src="https://cdn.tailwindcss.com"></script> 
</head>
<body class="bg-gray-50 flex flex-col h-screen items-center justify-center space-y-20">
    <header class="text-center text-3xl font-bold">Weather Checker</header>
    <article>
        <main class="space-y-6">
            <div>
                <form action="/search" id="weather-search" class="flex flex-rows">
                    <label for="search-input" class="sr-only">Search for a city</label>
                    <div class="flex flex-col items-center space-y-4">
                        <div class="flex flex-rows space-x-4">
                            <input type="text" name="cityName" id="search-input" class="px-8 border border-black rounded-xl focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-white" autocomplete="off" required >
                            <button class="searchBtn bg-black text-white p-4 rounded-xl hover:bg-gray-700 hover:text-white focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-black" type="button">search</button>
                        </div>
                        <h2 id="empty-message" class="text-xl">Add a city to get started</h2>
                    </div>
                </form>
                
            </div>
            <section id="city-card" class="bg-gray-500 flex flex-col items-center p-8 rounded-lg shadow-md relative">
                <button class="absolute top-2 right-2 text-gray-400 hover:text-red-500 text-xl font-bold focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-white">&times;</button>
                <h3 id="loading" class="hidden">Loading...</h1>
                <section id="city-grid" class=" w-full max-w-2xl mx-auto"></section>
                <h3 id="error" class="hidden">City not found</h3>
            </section>
        </main>
    </article>
    <script src="index.js"></script>
</body>
</html>
