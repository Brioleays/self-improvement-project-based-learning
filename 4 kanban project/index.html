<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <style type="text/tailwindcss"></style>
    <script src="https://cdn.tailwindcss.com"></script> 
</head>
<body class="bg-gray-50 flex flex-col h-screen items-center justify-center space-y-20">
    <article class="space-y-8">
        <header class="space-y-2">
            <h1 class="text-center text-3xl font-bold">Kanban Board</h1>
            <h2 class="text-center text-xl font-semibold">Order Your Day With Us</h2>
            <p id="wipCounter" class="text-sm text-gray-600 text-center hidden">Tasks in Progress: 0 / 3</p>
            <div id="priorityLegend" class="flex gap-4 text-sm">
                <span class="flex items-center gap-1"><span class="w-3 h-3 bg-yellow-400 rounded-full inline-block"></span> Pending</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 bg-red-500 rounded-full inline-block"></span> Urgent</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 bg-orange-500 rounded-full inline-block"></span> Necessary</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-500 rounded-full inline-block"></span> Side</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 bg-green-500 rounded-full inline-block"></span> Completed</span>
            </div>
        </header>
        <main>
            <section id="addingForm">
               
            </section>
            <section id="table" class="relative hidden">
                <div id="wipErrorMessageContainer" class="border border-red-700 bg-red-200 flex flex-row items-center max-w-7xl justify-between px-4 py-2 rounded-xl hidden">
                    <p class="text-red-700">You have passed the limit of tasks you can do at once pls finish the tasks you are working on first</p>
                    <p class="text-red-700">&times;</p>
                </div>
                
                <article id="threecolumns" class="grid grid-cols-3 text-center gap-6">
                    <div id="todo">
                        <h2 class="todo-header">Todo</h2>
                        <div  class="cardcontainer h-screen bg-white rounded-xl shadow-xl p-4 space-y-4 text-left">
                            <p>No task yet</p>
                            
                        <!-- planing on embedding this in the js and use an if else for ?.insertAdjacentHTML('beforeend', var name of cardContainer, cardcontainer2 and cardContainer#) using if in js; -->
                    </div>
                    <div id="inProgress">
                        <h2>In Progress</h2>
                        <div  class="cardcontainer h-screen bg-white rounded-xl shadow-xl p-4 space-y-4 text-left">
                            <p>No task in progress</p>

                        </div>
                    </div>
                    <div id="Done">
                        <h2>Done</h2>
                        <div  class="cardcontainer h-screen bg-white rounded-xl shadow-xl p-4 space-y-4 text-left">
                            <p>No task completed</p>

                        </div>
                    </div>
                </article>
                
                <button type="button" class="pop-up-btn absolute right-0 bottom-0 items-center bg-black text-white py-2 px-4 rounded-xl hover:bg-gray-700 hover:text-white focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-black">Add</button>
            </section>

            <dialog id="secondaryAdditionForm">

            </dialog>
        </main>
    </article>
    <script src="index.js"></script>
    <footer>&copy; 2026</footer>
</body>
</html>
